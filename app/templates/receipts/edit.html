{% extends "base.html" %} {% block content %}
<h1>Edit Receipt</h1>

<form
  method="POST"
  action="{{ url_for('receipts.edit_receipt', receipt_id=receipt.id) }}"
>
  <div>
    <label for="merchant">Merchant</label><br />
    <input
      type="text"
      id="merchant"
      name="merchant"
      value="{{ receipt.merchant }}"
      required
    />
  </div>

  <br />

  <div>
    <label for="amount">Amount</label><br />
    <input
      type="number"
      step="0.01"
      id="amount"
      name="amount"
      value="{{ receipt.amount }}"
      required
    />
  </div>

  <br />

  <div>
    <label for="category">Category</label><br />
    <input
      type="text"
      id="category"
      name="category"
      value="{{ receipt.category }}"
      required
    />
  </div>

  <br />

  <div>
    <label for="expense_date">Date</label><br />
    <input
      type="date"
      id="expense_date"
      name="expense_date"
      value="{{ receipt.expense_date }}"
      required
    />
  </div>

  <br />

  <div>
    <label for="notes">Notes</label><br />
    <textarea id="notes" name="notes" rows="4">
{{ receipt.notes or '' }}</textarea
    >
  </div>

  <br />

  <button type="submit">Update Receipt</button>
</form>
{% endblock %}
