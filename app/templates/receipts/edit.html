{% extends "base.html" %} {% block content %}
<section class="edit-expense-page">
  <div class="edit-expense-container">
    <div class="edit-expense-header">
      <div>
        <p class="page-label">Edit Expense</p>
        <h1>Update Expense Details</h1>
        <p>Modify your expense information below.</p>
      </div>
      <a href="{{ url_for('receipts.index') }}" class="back-btn">← Back to Expenses</a>
    </div>

    <form
      method="POST"
      action="{{ url_for('receipts.edit_receipt', receipt_id=receipt.id) }}"
      class="edit-expense-form"
    >
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      
      <div class="form-card">
        <h2>Expense Details</h2>
        
        <!-- Merchant -->
        <div class="form-group">
          <label for="merchant">Expense Name *</label>
          <input
            type="text"
            id="merchant"
            name="merchant"
            value="{{ receipt.merchant }}"
            placeholder="e.g. Woolworths"
            required
          />
          <span class="field-error" id="merchant-error"></span>
        </div>

        <!-- Category -->
        <div class="form-group">
          <label for="category">Category *</label>
          <select id="category" name="category" required>
            <option value="">Select category</option>
            <option value="Groceries" {% if receipt.category == "Groceries" %}selected{% endif %}>Groceries</option>
            <option value="Food" {% if receipt.category == "Food" %}selected{% endif %}>Food</option>
            <option value="Transport" {% if receipt.category == "Transport" %}selected{% endif %}>Transport</option>
            <option value="Bills" {% if receipt.category == "Bills" %}selected{% endif %}>Bills</option>
            <option value="Shopping" {% if receipt.category == "Shopping" %}selected{% endif %}>Shopping</option>
            <option value="Health" {% if receipt.category == "Health" %}selected{% endif %}>Health</option>
            <option value="Other" {% if receipt.category == "Other" %}selected{% endif %}>Other</option>
          </select>
        </div>

        <!-- Amount and Date -->
        <div class="form-row">
          <div class="form-group">
            <label for="amount">Amount (AUD) *</label>
            <input
              type="number"
              step="0.01"
              id="amount"
              name="amount"
              value="{{ receipt.amount }}"
              placeholder="0.00"
              required
            />
          </div>

          <div class="form-group">
            <label for="expense_date">Date *</label>
            <input
              type="date"
              id="expense_date"
              name="expense_date"
              value="{{ receipt.expense_date.strftime('%Y-%m-%d') }}"
              required
            />
          </div>
        </div>

        <!-- Frequency -->
        <div class="form-group">
          <label for="frequency">Frequency</label>
          <div class="frequency-options">
            <label class="frequency-label">
              <input type="radio" name="frequency" value="one-time" 
                {% if receipt.frequency_type == "one-time" %}checked{% endif %} id="freq-onetime">
              <span>One-time</span>
            </label>
            <label class="frequency-label">
              <input type="radio" name="frequency" value="recurring" 
                {% if receipt.frequency_type == "recurring" %}checked{% endif %} id="freq-recurring">
              <span>Recurring</span>
            </label>
          </div>
        </div>

        <!-- Frequency Details (for recurring) -->
        <div id="frequency-details-group" class="form-group" style="display: {% if receipt.frequency_type == 'recurring' %}block{% else %}none{% endif %};">
          <label for="frequency_interval">Recurrence Type</label>
          <select id="frequency_interval" name="frequency_interval">
            <option value="">Select recurrence</option>
            <option value="daily" {% if receipt.frequency_interval == "daily" %}selected{% endif %}>Daily</option>
            <option value="weekly" {% if receipt.frequency_interval == "weekly" %}selected{% endif %}>Weekly</option>
            <option value="monthly" {% if receipt.frequency_interval == "monthly" %}selected{% endif %}>Monthly</option>
          </select>
        </div>

        <div id="frequency-when-group" class="form-group" style="display: {% if receipt.frequency_type == 'recurring' %}block{% else %}none{% endif %};">
          <label for="frequency_details">When</label>
          <input 
            type="text" 
            id="frequency_details" 
            name="frequency_details" 
            value="{{ receipt.frequency_details or '' }}"
            placeholder="e.g. Monday, 15th"
          >
          <small style="color: #6c7c77; margin-top: 4px; display: block;">
            For weekly: Day name (e.g., Monday), For monthly: Day (e.g., 15th)
          </small>
        </div>

        <!-- Notes -->
        <div class="form-group">
          <label for="notes">Description / Notes</label>
          <textarea id="notes" name="notes" rows="4" placeholder="Optional: Add any additional notes">{{ receipt.notes or '' }}</textarea>
        </div>

        <!-- Form Actions -->
        <div class="form-actions">
          <a href="{{ url_for('receipts.index') }}" class="btn-secondary">Cancel</a>
          <button type="submit" class="btn-primary">Update Expense</button>
        </div>
      </div>
    </form>
  </div>
</section>

<style>
.edit-expense-page {
  padding: 32px 24px;
}

.edit-expense-container {
  max-width: 700px;
  margin: 0 auto;
}

.edit-expense-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 32px;
}

.edit-expense-header h1 {
  margin: 0;
  color: #12372f;
  font-size: 32px;
  font-weight: 800;
}

.edit-expense-header p {
  margin: 6px 0 0;
  color: #6c7c77;
  font-size: 14px;
}

.page-label {
  margin: 0;
  color: #16805f;
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.back-btn {
  padding: 10px 16px;
  background: #e4f6ef;
  border: 1px solid #c4e8e0;
  border-radius: 8px;
  color: #16805f;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  transition: 0.2s ease;
  display: inline-block;
}

.back-btn:hover {
  background: #16805f;
  color: #ffffff;
  border-color: #16805f;
}

.form-card {
  background: #ffffff;
  border: 1px solid rgba(22, 128, 95, 0.12);
  border-radius: 24px;
  padding: 32px;
  box-shadow: 0 14px 40px rgba(18, 55, 47, 0.10);
}

.form-card h2 {
  margin: 0 0 24px;
  color: #12372f;
  font-size: 18px;
  font-weight: 800;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  color: #294940;
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid #c4e8e0;
  border-radius: 8px;
  font-size: 14px;
  color: #334f48;
  background: #ffffff;
  font-family: inherit;
  transition: 0.2s ease;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: #16805f;
  box-shadow: 0 0 0 3px rgba(22, 128, 95, 0.1);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.form-actions {
  display: flex;
  gap: 12px;
  margin-top: 32px;
}

.btn-primary,
.btn-secondary {
  flex: 1;
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  text-align: center;
  transition: 0.2s ease;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.btn-primary {
  background: linear-gradient(135deg, #16805f 0%, #12372f 100%);
  color: #ffffff;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 16px rgba(22, 128, 95, 0.3);
}

.btn-secondary {
  background: #e4f6ef;
  color: #16805f;
  border: 1px solid #c4e8e0;
}

.btn-secondary:hover {
  background: #c4e8e0;
}

@media (max-width: 900px) {
  .edit-expense-header {
    flex-direction: column;
    gap: 16px;
  }

  .form-row {
    grid-template-columns: 1fr;
  }

  .form-actions {
    flex-direction: column;
  }

  .back-btn {
    width: 100%;
    text-align: center;
  }
}
</style>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const freqOnetimeRadio = document.getElementById('freq-onetime');
    const freqRecurringRadio = document.getElementById('freq-recurring');
    const frequencyDetailsGroup = document.getElementById('frequency-details-group');
    const frequencyWhenGroup = document.getElementById('frequency-when-group');

    function updateFrequencyFields() {
      if (freqRecurringRadio.checked) {
        frequencyDetailsGroup.style.display = 'block';
        frequencyWhenGroup.style.display = 'block';
      } else {
        frequencyDetailsGroup.style.display = 'none';
        frequencyWhenGroup.style.display = 'none';
      }
    }

    freqOnetimeRadio.addEventListener('change', updateFrequencyFields);
    freqRecurringRadio.addEventListener('change', updateFrequencyFields);
  });
</script>

{% endblock %}
