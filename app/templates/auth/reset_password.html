{% extends "base.html" %}

{% block content %}
<style>
    .reset-password-container {
        max-width: 400px;
        margin: 80px auto;
        padding: 0 20px;
    }

    .reset-password-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        padding: 40px;
    }

    .reset-password-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .reset-password-header h1 {
        font-size: 28px;
        color: #2c3e50;
        margin-bottom: 10px;
    }

    .reset-password-header p {
        color: #7f8c8d;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #2c3e50;
        font-weight: 600;
        font-size: 14px;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ecf0f1;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        transition: all 0.3s;
        box-sizing: border-box;
    }

    .form-group input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .password-requirements {
        background: #f5f6fa;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 12px;
        color: #555;
    }

    .password-requirements ul {
        margin: 0;
        padding-left: 20px;
        list-style: none;
    }

    .password-requirements li {
        margin: 4px 0;
        padding-left: 20px;
        position: relative;
    }

    .password-requirements li:before {
        content: "✓";
        position: absolute;
        left: 0;
        color: #27ae60;
        font-weight: bold;
    }

    .submit-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .back-to-login {
        text-align: center;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #ecf0f1;
    }

    .back-to-login a {
        color: #667eea;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.3s;
    }

    .back-to-login a:hover {
        text-decoration: underline;
    }
</style>

<div class="reset-password-container">
    <div class="reset-password-card">
        <div class="reset-password-header">
            <h1>Create New Password</h1>
            <p>Enter your new password below to regain access to your account</p>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label for="password">New Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter new password"
                    required
                    autofocus
                />
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required
                />
            </div>

            <div class="password-requirements">
                <strong>Password Requirements:</strong>
                <ul>
                    <li>At least 6 characters</li>
                    <li>Mix of letters and numbers recommended</li>
                </ul>
            </div>

            <button type="submit" class="submit-btn">Reset Password</button>
        </form>

        <div class="back-to-login">
            <p><a href="{{ url_for('auth.login') }}">← Back to Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
