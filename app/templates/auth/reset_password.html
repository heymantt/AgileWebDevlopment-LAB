{% extends "base.html" %}

{% block content %}
<style>
    .auth-container {
        max-width: 500px;
        margin: 60px auto;
        padding: 0 20px;
    }

    .auth-card {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .auth-header h1 {
        font-size: 28px;
        color: #2c3e50;
        margin-bottom: 10px;
        font-weight: 700;
    }

    .auth-header p {
        color: #7f8c8d;
        font-size: 14px;
        line-height: 1.6;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #2c3e50;
        font-size: 14px;
    }

    .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #ecf0f1;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        transition: all 0.3s;
        box-sizing: border-box;
    }

    .form-group input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-group input::placeholder {
        color: #bdc3c7;
    }

    .submit-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 10px;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .submit-btn:active {
        transform: translateY(0);
    }

    .password-requirements {
        background: #f0f4ff;
        border-left: 4px solid #667eea;
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 13px;
        color: #2c3e50;
        line-height: 1.6;
    }

    .password-requirements strong {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
    }

    .password-requirements ul {
        margin: 0;
        padding-left: 20px;
        list-style: none;
    }

    .password-requirements li:before {
        content: "✓ ";
        color: #28a745;
        font-weight: bold;
        margin-right: 4px;
    }

    @media (max-width: 600px) {
        .auth-container {
            margin: 30px auto;
        }

        .auth-card {
            padding: 25px;
        }

        .auth-header h1 {
            font-size: 24px;
        }
    }
</style>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>🔐 Reset Password</h1>
            <p>Create a new password for your account.</p>
        </div>

        <div class="password-requirements">
            <strong>Password Requirements:</strong>
            <ul>
                <li>At least 6 characters long</li>
                <li>Confirm the password matches</li>
            </ul>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

            <div class="form-group">
                <label for="new_password">New Password</label>
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                    autofocus
                />
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter new password"
                    minlength="6"
                    required
                />
            </div>

            <button type="submit" class="submit-btn">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
